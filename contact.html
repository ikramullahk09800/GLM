
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - GLM VPS</title>
    <meta name="description" content="Get in touch with GLM VPS support team. We are available 24/7 to help with your hosting needs.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">GLM<span>VPS</span></a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="pricing.html">Pricing</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <a href="pricing.html" class="btn-nav">Get Started</a>
        <button class="hamburger" onclick="toggleMenu()">☰</button>
    </nav>

    <section class="page-header">
        <h1>Contact Us</h1>
        <p>We are here to help. Reach out to us anytime.</p>
    </section>

    <section class="pricing" style="background: var(--dark);">
        <div class="contact-form">
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2024 GLM VPS. All rights reserved.</p>
        </div>
    </footer>
    <script>
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }
